name: DoSJE Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Backend Tests ──────────────────────────────────────────────────────
  test-server:
    name: Test Backend API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Seed database
        run: node db/seed.js
        working-directory: server

      - name: Start server in background
        run: node index.js &
        working-directory: server
        env:
          PORT: 5000
          JWT_SECRET: test_secret_ci

      - name: Wait for server to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:5000/api/dashboard/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Run API health check
        run: |
          curl -sf http://localhost:5000/api/dashboard/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Health check failed: {d}'
          print('✅ Health check passed')
          "

      - name: Test auth endpoint
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@dosje.gov.in","password":"Admin@123"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "✅ Login successful, token length: ${#TOKEN}"

          STATS=$(curl -sf http://localhost:5000/api/dashboard/stats \
            -H "Authorization: Bearer $TOKEN")
          echo "✅ Dashboard stats: $STATS"

          NGOS=$(curl -sf http://localhost:5000/api/ngos \
            -H "Authorization: Bearer $TOKEN")
          COUNT=$(echo $NGOS | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "✅ NGO count: $COUNT"

  # ─── Frontend Build ──────────────────────────────────────────────────────
  build-client:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build for production
        run: npm run build
        working-directory: client

      - name: Check build output
        run: |
          ls -la client/dist/
          echo "✅ Build output size:"
          du -sh client/dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosje-client-dist
          path: client/dist/
          retention-days: 7

  # ─── Docker Build ────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-server, build-client]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dosje-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dosje-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dosje-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dosje-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "## 🐳 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| dosje-server | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| dosje-client | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
