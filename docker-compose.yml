version: '3.9'

services:
  # ─── Backend API (Node.js + Express + SQLite) ─────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dosje_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dosje_super_secret_2024_change_in_prod}
    volumes:
      # Persist SQLite database across container restarts
      - sqlite_data:/app/db
      # Persist uploaded inspection photos
      - uploads_data:/app/uploads
    networks:
      - dosje_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/dashboard/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (React built, served via Nginx) ─────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dosje_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_started
    networks:
      - dosje_network

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local

# ─── Network ────────────────────────────────────────────────────────────────
networks:
  dosje_network:
    driver: bridge
