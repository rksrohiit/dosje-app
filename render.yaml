# Render.com deployment configuration
# Deploy at: https://render.com/deploy

services:
  # ─── Backend Web Service ─────────────────────────────────────
  - type: web
    name: dosje-server
    env: node
    region: singapore   # Closest to India
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node db/seed.js && node index.js
    healthCheckPath: /api/dashboard/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure secret

  # ─── Frontend Static Site ────────────────────────────────────
  - type: web
    name: dosje-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # Proxy API calls to backend
      - type: rewrite
        source: /api/*
        destination: https://dosje-server.onrender.com/api/:splat
      - type: rewrite
        source: /socket.io/*
        destination: https://dosje-server.onrender.com/socket.io/:splat
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
