[build]
builder = "NIXPACKS"
buildCommand = "cd server && npm ci"

[deploy]
startCommand = "cd server && node db/seed.js && node index.js"
healthcheckPath = "/api/dashboard/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "dosje-server"
source = "."
